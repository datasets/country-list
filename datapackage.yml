name: country-list
title: List of all countries with their 2-digit codes (ISO 3166-1)
description: >-
  ISO 3166-1 alpha-2 English country names and code elements, in alphabetical
  order of the name. Rebuilt from the ISO 3166-1 data in the pycountry package.

sources:
  - name: pycountry
    path: https://github.com/pycountry/pycountry
    title: pycountry, which includes the ISO 3166-1 data of the Debian iso-codes project

licenses:
  - name: ODC-PDDL-1.0
    path: https://opendatacommons.org/licenses/pddl/1.0/
    title: >-
      Open Data Commons Public Domain Dedication and License v1.0. Covers only
      the maintainers' own work (the script, the selection and arrangement of
      the list and the file). It does not cover the ISO 3166-1 codes or the
      country names. pycountry, where they come from, is licensed under the
      LGPL-2.1, which is a software licence. ISO's terms for the list and for
      the names (which ISO takes from United Nations sources) are unclear. See
      README.md and ATTRIBUTION.txt.

resources:
  - path: data.csv
    name: data
    format: csv
    mediatype: text/csv
    description: >-
      List of all countries with their English short names and corresponding
      ISO 3166-1 alpha-2 two-letter country codes.
    schema:
      fields:
        - name: Name
          description: >-
            English short name, as pycountry gives it, for example "Korea,
            Republic of". Names can contain commas (they are in quotes in the
            file) and brackets.
          type: string
        - name: Code
          description: >-
            ISO 3166-1 alpha-2 two-letter country code. Unique. Note: the code
            for Namibia is the string "NA", which some readers (for example
            pandas by default) turn into a missing value.
          type: string
          constraints:
            pattern: '^[A-Z]{2}$'
      primaryKey:
        - Code

collection: logistics-data
has_extended_version: true
has_solutions:
  - global-country-region-reference-data
  - logistics
  - worldwide-postal-code-database
