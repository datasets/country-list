name: country-list
title: List of all countries with their 2-digit codes (ISO 3166-1)
description: >-
  ISO 3166-1 alpha-2 English country names and code elements. This list states
  the English short names in alphabetical order as listed in ISO 3166-1,
  together with the corresponding ISO 3166-1 alpha-2 code elements.

sources:
  - name: ISO 3166 Maintenance Agency
    path: https://www.iso.org/obp/ui/#search/code/
    title: ISO Online Browsing Platform (OBP) — ISO 3166-1

licenses:
  - name: ODC-PDDL-1.0
    path: https://opendatacommons.org/licenses/pddl/1.0/
    title: >-
      Open Data Commons Public Domain Dedication and License v1.0. Covers only
      the maintainers' own selection and arrangement. The terms of the ISO
      3166-1 codes and of the country names (which ISO takes from United
      Nations sources) are unclear.

resources:
  - path: data.csv
    name: data
    format: csv
    mediatype: text/csv
    description: >-
      List of all countries with their official short names in English and
      corresponding ISO 3166-1 alpha-2 two-letter country codes. Note:
      "Western Sahara" appears as "Western Sahara*" in the ISO source; the
      asterisk denotes a provisional name.
    schema:
      fields:
        - name: Name
          description: >-
            English short name, written as ISO gives it, for example "Korea
            (the Republic of)". Names can contain commas, brackets and an
            asterisk ("Western Sahara*").
          type: string
        - name: Code
          description: >-
            ISO 3166-1 alpha-2 two-letter country code. Unique. Note: the code
            for Namibia is the string "NA", which some readers (for example
            pandas by default) turn into a missing value.
          type: string
          constraints:
            pattern: '^[A-Z]{2}$'
      primaryKey:
        - Code

collection: logistics-data
has_extended_version: true
has_solutions:
  - global-country-region-reference-data
  - logistics
  - worldwide-postal-code-database
